<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Search</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 16px;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    h2 {
        margin-top: 0;
        margin-bottom: 12px;
    }

    .search-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #222;
        color: white;
        outline: none;
    }

    button {
        padding: 9px 12px;
        border: none;
        border-radius: 7px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .primary {
        background: #555;
    }

    .status {
        font-size: 13px;
        color: #aaa;
        margin: 8px 0 12px;
    }

    .result {
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
    }

    .result-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .result-url {
        font-size: 12px;
        color: #7ab7ff;
        word-break: break-all;
        margin-bottom: 8px;
    }

    .result-description {
        font-size: 14px;
        color: #ccc;
        line-height: 1.45;
        margin-bottom: 10px;
    }

    .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }

    .pagination {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
    }

    .hidden {
        display: none;
    }

    /* Detailed view */

    #detailView {
        background: #181818;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 14px;
        margin-top: 12px;
    }

    #detailTitle {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    #detailUrl {
        color: #7ab7ff;
        font-size: 12px;
        word-break: break-all;
        margin-bottom: 12px;
    }

    #detailDescription {
        color: #ccc;
        line-height: 1.5;
        margin-bottom: 14px;
    }

    #researchContent {
        white-space: pre-wrap;
        color: #ddd;
        line-height: 1.55;
        font-size: 14px;
        max-height: 500px;
        overflow-y: auto;
        border-top: 1px solid #333;
        padding-top: 12px;
        margin-top: 12px;
    }

    .detail-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
    }

    .loading {
        color: #aaa;
        font-style: italic;
    }
</style>
</head>

<body>

<h2>🌐 Web Search</h2>

<div class="search-row">
    <input
        id="searchInput"
        type="text"
        placeholder="Search the web..."
    >
    <button class="primary" onclick="performSearch()">
        Search
    </button>
</div>

<div id="status" class="status">
    Enter a search query.
</div>

<div id="results"></div>

<div id="pagination" class="pagination hidden">
    <button id="previousButton" onclick="previousPage()">
        ← Previous
    </button>

    <button id="nextButton" onclick="nextPage()">
        Next →
    </button>
</div>

<div id="detailView" class="hidden">

    <div id="detailTitle"></div>

    <div id="detailUrl"></div>

    <div id="detailDescription"></div>

    <div class="detail-actions">

        <button onclick="openOriginal()">
            Open Original
        </button>

        <button onclick="copySelectedUrl()">
            Copy URL
        </button>

        <button class="primary" onclick="researchSelected()">
            🔎 Research
        </button>

        <button onclick="closeDetail()">
            Close
        </button>

    </div>

    <div id="researchContent"></div>

</div>

<script>

const SEARCH_ENDPOINT =
    "https://web.allancruise-fed.workers.dev/";

let currentQuery = "";
let currentPage = 1;
let totalPages = 1;

let selectedResult = null;


// --------------------------------------------------
// SEARCH
// --------------------------------------------------

async function performSearch() {

    const input =
        document.getElementById("searchInput");

    const query =
        input.value.trim();

    if (!query) {
        setStatus("Enter a search query.");
        return;
    }

    currentQuery = query;
    currentPage = 1;

    await loadSearch();
}


// --------------------------------------------------
// LOAD SEARCH PAGE
// --------------------------------------------------

async function loadSearch() {

    setStatus(
        "Searching..."
    );

    closeDetail();

    const resultsContainer =
        document.getElementById("results");

    resultsContainer.innerHTML = "";

    try {

        const url =
            SEARCH_ENDPOINT +
            "?q=" +
            encodeURIComponent(currentQuery) +
            "&page=" +
            currentPage;

        const response =
            await fetch(url);

        if (!response.ok) {
            throw new Error(
                "Search failed: HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        renderResults(data);

    } catch (error) {

        setStatus(
            "Search error: " +
            error.message
        );
    }
}


// --------------------------------------------------
// RENDER RESULTS
// --------------------------------------------------

function renderResults(data) {

    const resultsContainer =
        document.getElementById("results");

    resultsContainer.innerHTML = "";

    const results =
        data.results || [];

    totalPages =
        data.totalPages || 1;

    if (results.length === 0) {

        setStatus(
            "No results found."
        );

        updatePagination();

        return;
    }

    setStatus(
        `Results for "${data.query}" • Page ${currentPage}`
    );

    results.forEach((result) => {

        const card =
            document.createElement("div");

        card.className =
            "result";

        card.innerHTML = `
            <div class="result-title">
                ${escapeHtml(result.title || "Untitled")}
            </div>

            <div class="result-url">
                ${escapeHtml(result.url || "")}
            </div>

            <div class="result-description">
                ${escapeHtml(
                    result.description ||
                    "No description available."
                )}
            </div>

            <div class="actions">

                <button>
                    Open
                </button>

                <button>
                    Copy URL
                </button>

                <button class="primary">
                    🔎 Research
                </button>

            </div>
        `;

        const buttons =
            card.querySelectorAll("button");

        // Open
        buttons[0].onclick =
            () => openDetail(result);

        // Copy
        buttons[1].onclick =
            () => copyUrl(result.url);

        // Research
        buttons[2].onclick =
            () => researchResult(result);

        resultsContainer.appendChild(card);
    });

    updatePagination();
}


// --------------------------------------------------
// OPEN DETAILED RESULT
// --------------------------------------------------

function openDetail(result) {

    selectedResult =
        result;

    document.getElementById(
        "detailTitle"
    ).textContent =
        result.title || "Untitled";

    document.getElementById(
        "detailUrl"
    ).textContent =
        result.url || "";

    document.getElementById(
        "detailDescription"
    ).textContent =
        result.description ||
        "No description available.";

    document.getElementById(
        "researchContent"
    ).textContent = "";

    document.getElementById(
        "detailView"
    ).classList.remove("hidden");

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


// --------------------------------------------------
// RESEARCH RESULT
// --------------------------------------------------

async function researchResult(result) {

    openDetail(result);

    const researchArea =
        document.getElementById(
            "researchContent"
        );

    researchArea.innerHTML =
        '<div class="loading">🔎 Retrieving page content...</div>';

    try {

        const url =
            SEARCH_ENDPOINT +
            "?url=" +
            encodeURIComponent(result.url);

        const response =
            await fetch(url);

        if (!response.ok) {
            throw new Error(
                "Research failed: HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        displayResearch(data);

    } catch (error) {

        researchArea.textContent =
            "Research error: " +
            error.message;
    }
}


// --------------------------------------------------
// RESEARCH FROM DETAIL VIEW
// --------------------------------------------------

async function researchSelected() {

    if (!selectedResult) {
        return;
    }

    await researchResult(
        selectedResult
    );
}


// --------------------------------------------------
// DISPLAY RESEARCH
// --------------------------------------------------

function displayResearch(data) {

    const researchArea =
        document.getElementById(
            "researchContent"
        );

    let content = "";

    if (data.summary) {

        content +=
            "SUMMARY\n\n" +
            data.summary +
            "\n\n";
    }

    if (data.content) {

        content +=
            "SOURCE CONTENT\n\n" +
            data.content;
    }

    if (!content) {

        content =
            data.text ||
            "No readable content was returned.";
    }

    researchArea.textContent =
        content;
}


// --------------------------------------------------
// OPEN ORIGINAL
// --------------------------------------------------

function openOriginal() {

    if (!selectedResult) {
        return;
    }

    window.open(
        selectedResult.url,
        "_blank"
    );
}


// --------------------------------------------------
// COPY URL
// --------------------------------------------------

async function copySelectedUrl() {

    if (!selectedResult) {
        return;
    }

    await copyUrl(
        selectedResult.url
    );
}


async function copyUrl(url) {

    try {

        await navigator.clipboard.writeText(
            url
        );

        setStatus(
            "URL copied."
        );

    } catch {

        setStatus(
            "Could not copy URL."
        );
    }
}


// --------------------------------------------------
// CLOSE DETAIL
// --------------------------------------------------

function closeDetail() {

    document.getElementById(
        "detailView"
    ).classList.add("hidden");

    selectedResult =
        null;
}


// --------------------------------------------------
// PAGINATION
// --------------------------------------------------

function nextPage() {

    if (
        currentPage >= totalPages
    ) {
        return;
    }

    currentPage++;

    loadSearch();
}


function previousPage() {

    if (currentPage <= 1) {
        return;
    }

    currentPage--;

    loadSearch();
}


function updatePagination() {

    const pagination =
        document.getElementById(
            "pagination"
        );

    const previous =
        document.getElementById(
            "previousButton"
        );

    const next =
        document.getElementById(
            "nextButton"
        );

    if (
        !currentQuery ||
        totalPages <= 1
    ) {

        pagination.classList.add(
            "hidden"
        );

        return;
    }

    pagination.classList.remove(
        "hidden"
    );

    previous.disabled =
        currentPage <= 1;

    next.disabled =
        currentPage >= totalPages;
}


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent =
        message;
}


// --------------------------------------------------
// BASIC HTML ESCAPING
// --------------------------------------------------

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// --------------------------------------------------
// ENTER KEY SEARCH
// --------------------------------------------------

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {
                performSearch();
            }

        }
    );

</script>

</body>
</html>
